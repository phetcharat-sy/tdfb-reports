<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ภาพรวม KPI ทุกแผนก · TDFB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--teal:#3E8E8C;--teal-d:#2F6F6D;--plum:#6B5CA5;--plum-d:#514682;
      --amber:#D89A2E;--rose:#B4462F;--good:#3F7A65;--bad:#B4462F;
      --page:#EEF0F3;--card:#FFF;--soft:#F7F8FA;--line:#E3E6EB;--ink:#22252C;--mute:#5F6675}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:Tahoma,"Segoe UI",sans-serif;font-size:19px;line-height:1.6}
.wrap{max-width:none;margin:0 auto;padding:24px 10% 40px}

.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.btn{background:var(--teal);color:#fff;border:0;font-family:inherit;font-weight:bold;
  font-size:21px;padding:13px 24px;border-radius:7px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:normal}
.btn:disabled{opacity:.5;cursor:default}
select{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:7px;
  padding:13px 16px;font-family:inherit;font-size:21px}
.btn:focus-visible,select:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.stat{color:var(--mute);font-size:19.5px;margin-left:auto}
.stat b{color:var(--teal-d)} .stat.err b{color:var(--rose)}
.tabs{display:flex;gap:6px;background:#E4E7EC;padding:5px;border-radius:11px;width:fit-content;margin-bottom:14px}
.tabs a{text-decoration:none;font-size:20px;padding:10px 26px;border-radius:8px;color:var(--mute)}
.tabs a.on{background:var(--teal);color:#fff;font-weight:bold}

#shot{background:var(--card);border-radius:14px;padding:34px 46px 40px;
  box-shadow:0 1px 3px rgba(20,24,40,.07),0 8px 24px rgba(20,24,40,.05)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
  flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:22px}
h1{margin:0;font-size:49.4px;letter-spacing:-.2px;line-height:1.25;
  border-left:7px solid var(--teal);padding-left:14px}
.sub{color:var(--mute);font-size:23px;margin:8px 0 0 21px}
.period{text-align:right;color:var(--mute);font-size:19.5px}
.period b{display:block;color:var(--ink);font-size:31.2px;font-weight:normal}

h2.sec{font-size:27px;margin:30px 0 12px;display:flex;align-items:center;gap:12px}
h2.sec span{flex:1;height:1px;background:var(--line)}
h2.sec em{font-style:normal;font-size:19px;color:var(--mute);font-weight:normal}

.top{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.big{border-radius:12px;padding:26px 30px;color:#fff}
.big.a{background:var(--teal)} .big.b{background:var(--plum)}
.big .l{font-size:23px;opacity:.95}
.big .v{font-size:74px;font-weight:bold;line-height:1.05;letter-spacing:-1px;margin-top:4px}
.big .n{font-size:19px;opacity:.9;margin-top:4px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.kpi{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:20px 22px;
  display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--mute)}
.kpi.pass::before{background:var(--good)} .kpi.fail::before{background:var(--bad)}
.kpi.wait::before{background:#C9CDD6}
.kpi .l{font-size:21px;font-weight:bold}
.kpi .t{font-size:17px;color:var(--mute)}
.row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:2px}
.kpi .v{font-size:52px;font-weight:bold;letter-spacing:-1px;line-height:1.1}
.kpi.wait .v{font-size:28px;color:var(--mute)}
.badge{font-size:17px;padding:2px 12px;border-radius:20px;white-space:nowrap}
.badge.pass{background:#E3F0EA;color:var(--good)}
.badge.fail{background:#F7E4DF;color:var(--bad)}
.badge.wait{background:#EEF0F3;color:var(--mute)}
.delta{font-size:19px;white-space:nowrap}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--mute)}
.kpi .base{font-size:16px;color:var(--mute)}
.bar{height:7px;background:#E4E7EC;border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--good)}
.kpi.fail .bar i{background:var(--bad)}
.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
  color:var(--mute);font-size:17px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:1000px){.wrap{padding-left:4%;padding-right:4%}#shot{padding:22px 18px 28px}
  .top{grid-template-columns:1fr}h1{font-size:34px}}
</style>
</head>
<body>
<div class="wrap">

<div class="tabs">
  <a href="#" class="on">ภาพรวม KPI</a>
  <a href="./report.html">รายงานรายทีม</a>
</div>

<div class="toolbar">
  <select id="day" autocomplete="off"><option value="">กำลังโหลด…</option></select>
  <button class="btn ghost" id="reload">ดึงข้อมูลใหม่</button>
  <button class="btn" id="save">บันทึกเป็นรูป</button>
  <div class="stat" id="stat">กำลังดึงข้อมูล…</div>
</div>

<div id="shot">
  <header>
    <div>
      <h1>ภาพรวม KPI ทุกแผนก</h1>
      <div class="sub">Warehouse · Delivery · Admin — TDFB</div>
    </div>
    <div class="period">ข้อมูลของวันที่<b id="period">—</b>
      <div id="cmpNote" style="font-size:17px;margin-top:4px">เทียบกับเดือนก่อน</div></div>
  </header>

  <div class="top" id="top"></div>

  <h2 class="sec">Warehouse <em id="whNote"></em><span></span></h2>
  <div class="kpis" id="wh"></div>

  <h2 class="sec">Delivery<span></span></h2>
  <div class="kpis" id="dl"></div>

  <h2 class="sec">Admin<span></span></h2>
  <div class="kpis" id="ad"></div>

  <div class="foot"><span id="src"></span><span id="ts">—</span></div>
</div>
</div>
<script>
const S_OTP='1WkCx6lRNm-4LyX8CY9EEPSb2NuZPxZV0YE_z3ayu8ys';   /* KPI On-Time / Out of Stock */
const S_DIFF='1PW5l0CVt2uIGBXWOHeDjyyTil2o5O0IsseBR_2drrm4'; /* Stock Diff */
const S_DOCK='1wE-ElRc3EtMshE54wnK_B2xBtD_cKyo-k5hWTy3zOrY'; /* Dock to Stock */
const G_DOCK='1625574187';

const el=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('en-US');
const pct=n=>n==null?'—':n.toFixed(2)+'%';
const MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
              'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const showD=k=>{if(!k)return '—';const[y,m,d]=k.split('-');return `${d} ${MONTHS[+m-1]} ${y}`;};

function parseCSV(t){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(c!=='\r')cell+=c;}
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows;
}
/* ชีต On-Time มีข้อมูลกว่าแสนแถว จึงให้ Google สรุปมาให้ก่อนด้วย gviz query
   แทนการดึงทั้งไฟล์มาคำนวณในเบราว์เซอร์ */
async function gviz(sheet,gid,q){
  const u=`https://docs.google.com/spreadsheets/d/${sheet}/gviz/tq?tqx=out:csv&gid=${gid}`
        +(q?`&tq=${encodeURIComponent(q)}`:'');
  const r=await fetch(u);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();
  if(/^\/\*O_o\*\//.test(t)||/"errors"/.test(t))throw new Error('query error');
  return parseCSV(t).slice(1);
}
const toKey=s=>{s=String(s||'').trim();
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:'';
};
/* วันเดียวกันของเดือนก่อน — ถ้าเดือนก่อนไม่มีวันนั้น (เช่น 31 มี.ค. → ก.พ.) ให้ใช้วันสุดท้ายของเดือน */
const prevMonth=k=>{const[y,m,d]=k.split('-').map(Number);
  const py=m===1?y-1:y, pm=m===1?12:m-1;
  const dd=Math.min(d,new Date(py,pm,0).getDate());
  return `${py}-${String(pm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;};

/* ---------- ดึงข้อมูล ---------- */
let DATES=[],DIFF=null,DOCK=null;

async function dayStats(key){
  /* หนึ่งแถว = หนึ่งออเดอร์ของวันนั้น (group by Order Reference) */
  const q=`select F, L, M, sum(V) where E = date '${key}' group by F, L, M`;
  let rows;
  try{ rows=await gviz(S_OTP,'0',q); }
  catch(e){
    const [y,m,d]=key.split('-');
    rows=await gviz(S_OTP,'0',
      `select F, L, M, sum(V) where E = '${+d}/${+m}/${y}' group by F, L, M`);
  }
  if(!rows.length)return null;
  const orders=rows.length;
  const items=rows.reduce((s,r)=>s+(Number(r[3])||0),0);
  const onTime=rows.filter(r=>/แพ็คเสร็จในวัน/.test(r[2])).length;
  const inStock=rows.filter(r=>String(r[1]).trim()==='ใช่').length;
  return {orders,items,otp:onTime/orders*100,oos:inStock/orders*100};
}

async function loadStatic(){
  /* Stock Diff — ทั้งไฟล์เล็ก ดึงมาคำนวณเองได้ */
  const d=await gviz(S_DIFF,'0','select A, I');
  const by={};
  d.forEach(r=>{const mth=(r[0]||'').trim(),ck=(r[1]||'').trim();
    if(!mth||!ck)return;
    (by[mth]=by[mth]||{n:0,bad:0}).n++;
    if(ck.includes('ไม่ตรง'))by[mth].bad++;});
  DIFF=by;

  /* Dock to Stock */
  const k=await gviz(S_DOCK,G_DOCK,'select B, J');
  const by2={};
  k.forEach(r=>{const mth=(r[0]||'').trim(),g=(r[1]||'').trim();
    if(!mth||!g)return;
    (by2[mth]=by2[mth]||{n:0,ok:0}).n++;
    if(g.includes('ผ่าน')&&!g.includes('ไม่ผ่าน'))by2[mth].ok++;});
  DOCK=by2;
}

/* ---------- แสดงผล ---------- */
function deltaHTML(cur,prev,goodUp=true,unit='%'){
  if(cur==null||prev==null)return '<span class="delta flat">— ไม่มีข้อมูลเทียบ</span>';
  const d=cur-prev;
  if(Math.abs(d)<0.005)return '<span class="delta flat">เท่าเดิม</span>';
  const good=goodUp?d>0:d<0;
  const arrow=d>0?'▲':'▼';
  const v=unit==='%'?Math.abs(d).toFixed(2)+' จุด':fmt(Math.abs(d));
  const rel=prev!==0?` (${(d/prev*100>0?'+':'')}${(d/prev*100).toFixed(1)}%)`:'';
  return `<span class="delta ${good?'up':'down'}">${arrow} ${v}${unit==='%'?'':rel}</span>`;
}
function kpiCard(o){
  if(o.wait)return `<div class="kpi wait"><div class="l">${o.l}</div><div class="t">${o.t}</div>
    <div class="row"><div class="v">รอข้อมูล</div><span class="badge wait">ยังไม่ได้เชื่อมชีต</span></div>
    <div class="base">${o.note||''}</div></div>`;
  const ok=o.pass;
  const w=Math.max(0,Math.min(100,o.bar!=null?o.bar:o.v));
  return `<div class="kpi ${ok?'pass':'fail'}">
    <div class="l">${o.l}</div><div class="t">${o.t}</div>
    <div class="row"><div class="v">${o.disp}</div>
      <span class="badge ${ok?'pass':'fail'}">${ok?'ผ่านเกณฑ์':'ต่ำกว่าเกณฑ์'}</span>
      ${o.delta||''}</div>
    <div class="base">${o.base||''}</div>
    <div class="bar"><i style="width:${w}%"></i></div></div>`;
}

async function render(key){
  el('period').textContent=showD(key);
  const pk=prevMonth(key);
  el('cmpNote').textContent='เทียบกับ '+showD(pk);

  const [cur,prev]=await Promise.all([dayStats(key),dayStats(pk).catch(()=>null)]);

  el('top').innerHTML=`
    <div class="big a"><div class="l">จำนวนออเดอร์</div>
      <div class="v">${cur?fmt(cur.orders):'—'}</div>
      <div class="n">${cur&&prev?`เดือนก่อน ${fmt(prev.orders)} · ${cur.orders>=prev.orders?'▲':'▼'} ${fmt(Math.abs(cur.orders-prev.orders))} (${((cur.orders-prev.orders)/prev.orders*100).toFixed(1)}%)`:'ไม่มีข้อมูลเทียบ'}</div></div>
    <div class="big b"><div class="l">จำนวนสินค้า (ชิ้น)</div>
      <div class="v">${cur?fmt(cur.items):'—'}</div>
      <div class="n">${cur&&prev?`เดือนก่อน ${fmt(prev.items)} · ${cur.items>=prev.items?'▲':'▼'} ${fmt(Math.abs(cur.items-prev.items))} (${((cur.items-prev.items)/prev.items*100).toFixed(1)}%)`:'ไม่มีข้อมูลเทียบ'}</div></div>`;

  /* Stock Diff / Dock to Stock เก็บเป็นรายเดือน จึงเทียบเดือนต่อเดือน */
  const [y,m]=key.split('-');
  const mKey=`${m}-${y}`, pmKey=`${String(+m===1?12:+m-1).padStart(2,'0')}-${+m===1?+y-1:y}`;
  const dNow=DIFF?DIFF[mKey]:null, dPrev=DIFF?DIFF[pmKey]:null;
  const diffV=dNow?dNow.bad/dNow.n*100:null, diffP=dPrev?dPrev.bad/dPrev.n*100:null;

  const thMonth=MONTHS[+m-1], thPrev=MONTHS[(+m+10)%12];
  const kNow=DOCK?DOCK[thMonth]:null, kPrev=DOCK?DOCK[thPrev]:null;
  const dockV=kNow?kNow.ok/kNow.n*100:null, dockP=kPrev?kPrev.ok/kPrev.n*100:null;

  el('whNote').textContent=`On-Time / Out of Stock = รายวัน · Stock Diff / Dock to Stock = รายเดือน (${thMonth} ${y})`;

  el('wh').innerHTML=[
    cur?kpiCard({l:'On-Time Performance',t:'เป้าหมาย ≥ 98% · แพ็คเสร็จในวันที่ต้องส่ง',
      disp:pct(cur.otp),v:cur.otp,pass:cur.otp>=98,
      delta:deltaHTML(cur.otp,prev?prev.otp:null,true),
      base:`${fmt(Math.round(cur.otp/100*cur.orders))} จาก ${fmt(cur.orders)} ออเดอร์`}):
      kpiCard({l:'On-Time Performance',t:'เป้าหมาย ≥ 98%',wait:true,note:'ไม่มีข้อมูลของวันนี้'}),
    cur?kpiCard({l:'Out of Stock',t:'เป้าหมาย ≥ 99% · WH ส่งของให้ PK ได้ในวัน',
      disp:pct(cur.oos),v:cur.oos,pass:cur.oos>=99,
      delta:deltaHTML(cur.oos,prev?prev.oos:null,true),
      base:`${fmt(Math.round(cur.oos/100*cur.orders))} จาก ${fmt(cur.orders)} ออเดอร์`}):
      kpiCard({l:'Out of Stock',t:'เป้าหมาย ≥ 99%',wait:true,note:'ไม่มีข้อมูลของวันนี้'}),
    diffV!=null?kpiCard({l:'Stock Diff',t:'เป้าหมาย < 2% · ยอดนับไม่ตรงระบบ',
      disp:pct(diffV),v:diffV,bar:diffV*10,pass:diffV<2,
      delta:deltaHTML(diffV,diffP,false),
      base:`ไม่ตรง ${fmt(dNow.bad)} จาก ${fmt(dNow.n)} รายการที่นับ`}):
      kpiCard({l:'Stock Diff',t:'เป้าหมาย < 2%',wait:true,note:'ยังไม่มีข้อมูลของเดือนนี้'}),
    dockV!=null?kpiCard({l:'Dock to Stock',t:'สัดส่วนรับเข้าที่ผ่านเกณฑ์เวลา',
      disp:pct(dockV),v:dockV,pass:dockV>=90,
      delta:deltaHTML(dockV,dockP,true),
      base:`ผ่านเกณฑ์ ${fmt(kNow.ok)} จาก ${fmt(kNow.n)} ใบรับเข้า`}):
      kpiCard({l:'Dock to Stock',t:'สัดส่วนรับเข้าที่ผ่านเกณฑ์เวลา',wait:true,note:'ยังไม่มีข้อมูลของเดือนนี้'})
  ].join('');

  el('dl').innerHTML=kpiCard({l:'Human Error',t:'เป้าหมาย 0 เคส/เดือน',wait:true,
    note:'ยังไม่ได้ระบุชีตต้นทาง — เตรียมช่องไว้แล้ว'});
  el('ad').innerHTML=kpiCard({l:'Admin On-Time',t:'เป้าหมาย ≥ 85%',wait:true,
    note:'ยังไม่ได้ระบุชีตต้นทาง — เตรียมช่องไว้แล้ว'});

  el('src').textContent='ที่มา: KPI On-Time/Out of Stock · Stock Diff · Dock to Stock (Google Sheets)';
  const now=new Date();
  el('ts').textContent=`ข้อมูล ณ ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()} `
    +`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} น.`;
}

async function boot(){
  el('stat').className='stat';el('stat').textContent='กำลังดึงข้อมูล…';el('reload').disabled=true;
  try{
    const [dates]=await Promise.all([
      gviz(S_OTP,'0','select E, count(F) group by E order by E'),
      loadStatic().catch(e=>console.warn('static',e))
    ]);
    DATES=[...new Set(dates.map(r=>toKey(r[0])).filter(Boolean))].sort();
    el('day').innerHTML=DATES.slice().reverse().map(d=>`<option value="${d}">${showD(d)}</option>`).join('');
    el('stat').innerHTML='เชื่อมกับ Google Sheet แล้ว · <b>ข้อมูลสด</b>';
    await render(DATES[DATES.length-1]);
  }catch(e){
    el('stat').className='stat err';
    el('stat').innerHTML='<b>ดึงข้อมูลไม่ได้</b> — ตรวจว่าชีตแชร์เป็น “ทุกคนที่มีลิงก์” ('+e.message+')';
  }
  el('reload').disabled=false;
}
el('day').addEventListener('change',e=>render(e.target.value));
el('reload').addEventListener('click',boot);
el('save').addEventListener('click',async()=>{
  const b=el('save');b.disabled=true;b.textContent='กำลังบันทึก…';
  try{
    const c=await html2canvas(el('shot'),{scale:2,backgroundColor:'#FFFFFF',useCORS:true});
    const a=document.createElement('a');
    a.download=`kpi-overview-${el('day').value||'latest'}.png`;
    a.href=c.toDataURL('image/png');a.click();
  }catch(e){alert('บันทึกรูปไม่สำเร็จ: '+e.message);}
  b.disabled=false;b.textContent='บันทึกเป็นรูป';
});
boot();
</script>
</body>
</html>
