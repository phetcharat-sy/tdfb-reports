<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>รายงานทีม · TDFB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--teal:#3E8E8C;--teal-d:#2F6F6D;--plum:#6B5CA5;--plum-d:#514682;
      --amber:#D89A2E;--rose:#B4462F;--page:#EEF0F3;--card:#FFF;--soft:#F7F8FA;
      --line:#E3E6EB;--ink:#22252C;--mute:#5F6675}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:Tahoma,"Segoe UI",sans-serif;font-size:19px;line-height:1.6}
.wrap{max-width:1760px;margin:0 auto;padding:24px 90px 26px;
  height:100vh;display:flex;flex-direction:column;overflow:hidden}

.teams{display:flex;gap:6px;align-items:center;margin-bottom:14px;flex:none;
  background:#E4E7EC;padding:5px;border-radius:11px;width:fit-content}
.teams button{background:none;border:0;font-family:inherit;font-size:20px;
  padding:10px 26px;border-radius:8px;color:var(--mute);cursor:pointer}
.teams button[aria-selected="true"]{background:var(--teal);color:#fff;font-weight:bold}
.teams button:hover:not([aria-selected="true"]){background:#F2F4F7;color:var(--ink)}
.teams button:focus-visible,.btn:focus-visible,select:focus-visible{outline:2px solid var(--plum);outline-offset:2px}

.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px;flex:none}
.btn{background:var(--teal);color:#fff;border:0;font-family:inherit;font-weight:bold;
  font-size:21px;padding:13px 24px;border-radius:7px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:normal}
.btn:disabled{opacity:.5;cursor:default}
select{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:7px;
  padding:13px 16px;font-family:inherit;font-size:21px}
select:disabled{opacity:.45}
.stat{color:var(--mute);font-size:19.5px;margin-left:auto}
.stat b{color:var(--teal-d)} .stat.err b{color:var(--rose)}

.calwrap{position:relative}
#fdBtn[data-on="1"]{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:bold}
.cal{position:absolute;top:calc(100% + 6px);left:0;z-index:50;width:272px;background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 6px 24px rgba(20,24,40,.16)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-size:17.6px;font-weight:bold}
.cal .nav{background:#F2F4F7;border:1px solid var(--line);border-radius:6px;width:28px;height:28px;
  font-size:16px;line-height:1;color:var(--ink);cursor:pointer;font-family:inherit}
.cal .nav:disabled{opacity:.3;cursor:default}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
.cal-dow span{text-align:center;font-size:10.5px;color:var(--mute)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-g button{aspect-ratio:1;border:0;background:none;border-radius:6px;cursor:pointer;
  font-family:inherit;font-size:12.5px;color:#B6BBC5;position:relative;padding:0}
.cal-g button.has{color:var(--ink);background:#EDF3F3;font-weight:bold}
.cal-g button.has:hover{background:#D9E7E6}
.cal-g button.sel{background:var(--teal);color:#fff}
.cal-g button:disabled{cursor:default}
.cal-g button.has::after{content:"";position:absolute;left:50%;bottom:3px;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--teal)}
.cal-g button.sel::after{background:#fff}
.cal-g .pad{visibility:hidden}
.cal-f{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:9px;
  border-top:1px solid var(--line);font-size:14px;color:var(--mute)}
.cal-f .dot{width:5px;height:5px;border-radius:50%;background:var(--teal);display:inline-block;margin-right:5px}
.cal-f .lnk{background:none;border:0;color:var(--teal);font-family:inherit;font-size:14px;
  cursor:pointer;text-decoration:underline;padding:0}

#shot{background:var(--card);border-radius:14px;padding:34px 46px;
  display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;
  box-shadow:0 1px 3px rgba(20,24,40,.07),0 8px 24px rgba(20,24,40,.05)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex:none;
  flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
h1{margin:0;font-size:49.4px;letter-spacing:-.2px;line-height:1.25;
  border-left:7px solid var(--teal);padding-left:14px}
.sub{color:var(--mute);font-size:23px;margin:8px 0 0 21px}
.period{text-align:right;color:var(--mute);font-size:19.5px}
.period b{display:block;color:var(--ink);font-size:31.2px;font-weight:normal}
.chip{display:inline-block;background:var(--plum);color:#fff;padding:3px 15px;
  border-radius:20px;font-size:19.5px;margin-top:8px}

.kpis{display:grid;gap:14px;margin-bottom:16px;flex:none}
.kpi{border-radius:11px;padding:20px 22px;color:#fff;
  box-shadow:0 1px 2px rgba(20,24,40,.09),0 3px 10px rgba(20,24,40,.06)}
.kpi.c0{background:var(--teal)} .kpi.c1{background:var(--teal-d)}
.kpi.c2{background:var(--plum)} .kpi.c3{background:var(--plum-d)}
.kpi.c4{background:var(--amber)}
.kpi.pending{background:#fff;color:var(--mute);border:1px dashed var(--line);box-shadow:none}
.kpi .l{font-size:23px;opacity:.95}
.kpi .v{font-size:64px;font-weight:bold;margin-top:3px;line-height:1.1;letter-spacing:-.5px}
.kpi .n{font-size:19.5px;opacity:.85;margin-top:3px}
.kpi.pending .v{font-size:28px;padding-top:12px}

.panels{display:grid;gap:16px;flex:1;min-height:0}
.panel{background:var(--soft);border:1px solid var(--line);border-radius:10px;
  padding:0;display:flex;flex-direction:column;min-height:340px;overflow:hidden}
.panel .hd{padding:16px 18px 13px;border-bottom:1px solid var(--line);background:#fff}
.panel .hd.a{border-top:3px solid var(--teal)}
.panel .hd.b{border-top:3px solid var(--plum)}
.panel .hd.c{border-top:3px solid var(--amber)}
.panel h2{margin:0;font-size:27.3px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel h2 em{font-style:normal;color:var(--mute);font-size:20.8px;white-space:nowrap}
.cap{color:var(--mute);font-size:23px;margin-top:3px}

table{width:100%;border-collapse:collapse;font-size:23px}
th{background:#F0F2F5;text-align:left;color:var(--mute);font-weight:normal;font-size:23px;
  padding:11px 16px;position:sticky;top:0}
td{padding:13px 16px;border-bottom:1px solid #ECEEF2;vertical-align:top}
tbody tr:hover td{background:#fff}
tr.newday td{border-top:1px solid #DDE1E7}
td.d{color:var(--mute);white-space:nowrap}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{border-bottom:0;border-top:1px solid var(--line);padding-top:12px;font-weight:bold;background:var(--soft)}
tfoot .num{color:var(--teal-d)}
.tag{display:inline-block;background:#EDF3F3;border:1px solid #DCE6E6;color:var(--teal-d);
  font-size:23px;padding:1px 10px;border-radius:5px;margin-bottom:4px}
.empty{color:var(--mute);text-align:center;padding:70px 18px;font-size:21.4px;line-height:1.95}
.empty b{display:block;color:var(--ink);font-weight:normal;margin-bottom:6px;font-size:24.7px}
.scroll{flex:1;min-height:0;overflow:auto}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:#CBD0D9;border-radius:4px}
.foot{margin-top:14px;flex:none;padding-top:12px;border-top:1px solid var(--line);
  color:var(--mute);font-size:18.2px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* โหมดพรีเซนต์ */
body.present .teams,body.present .toolbar{display:none}
body.present .wrap{padding:14px 26px 16px;max-width:none}
body.present #shot{padding:26px 30px}
body.present .kpi .v{font-size:76px}
body.present table{font-size:26px}
body.present h1{font-size:56px}
.exit{position:fixed;top:12px;right:16px;z-index:99;display:none}
body.present .exit{display:block}

/* โหมดถ่ายรูป */
body.cap .wrap{height:auto;overflow:visible;padding:0}
#shot.cap-slide{width:1600px;height:900px;flex:none;overflow:hidden;border-radius:0;padding:34px 52px}
#shot.cap-full{height:auto;flex:none;overflow:visible}
#shot.cap-full .panels{flex:none}
#shot.cap-full .scroll{overflow:visible;max-height:none}
#shot.cap-full .panel{min-height:0}

@media(max-width:1600px){.wrap{padding-left:46px;padding-right:46px}#shot{padding-left:30px;padding-right:30px}}
@media(max-width:1400px){.panels{grid-template-columns:1fr 1fr!important}.kpis{grid-template-columns:repeat(3,1fr)!important}}
@media(max-width:1000px){.wrap{padding-left:18px;padding-right:18px}#shot{padding-left:18px;padding-right:18px}}
@media(max-width:900px){.panels{grid-template-columns:1fr!important}.kpis{grid-template-columns:1fr 1fr!important}h1{font-size:36.4px}}
</style>
</head>

<div class="wrap">

<nav class="teams" role="tablist" aria-label="เลือกทีม">

  <button class="btn ghost" id="clear">ล้างตัวกรอง</button>

  <button class="btn" id="save">บันทึกเป็นรูป</button>
  <button class="btn ghost" id="present">🖥 โหมดพรีเซนต์</button>
  <div class="stat" id="stat">กำลังดึงข้อมูล…</div>
</div>

<div id="shot">
  <header>
    <div>
      <h1 id="title">รายงานทีม Delivery</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="period">ช่วงข้อมูล<b id="period">—</b><span class="chip" id="chip" style="display:none"></span></div>
  </header>
  <div class="kpis" id="kpis"></div>
  <div class="panels" id="panels"></div>
  <div class="foot">
    <span id="source"></span><span id="ts">—</span>
  </div>
</div>

function toKey(s){
  s=String(s||'').trim();
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;if(y>2500)y-=543;
        return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:'';
}
const show=k=>{if(!k)return '—';const[y,m,d]=k.split('-');return `${d}/${m}/${y.slice(2)}`;};

function parseCSV(t){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(c!=='\r')cell+=c;}
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows;
}

function toRows(csv){
  const raw=parseCSV(csv);let hi=-1;
  for(let i=0;i<Math.min(6,raw.length);i++) if(raw[i].some(c=>/วันที่/.test(c))){hi=i;break;}
  if(hi<0)return [];
  const H=raw[hi].map(c=>String(c).replace(/\s+/g,''));
  const find=(...p)=>{for(const x of p){const i=H.findIndex(h=>h.includes(x));if(i>=0)return i;}return -1;};
  const iD=find('วันที่พบปัญหา','วันที่จัดทำ','วันที่ได้รับ','วันที่'),iW=find('สัปดาห์'),
        iT=find('รายละเอียด','ปัญหาที่พบ','รายการสินค้า'),iQ=find('จำนวน'),
        iG=find('เกณฑ์','ประเภทสาเหตุ','ผู้แจ้ง');
  return raw.slice(hi+1).map(r=>{
    const det=(r[iT]||'').trim(),d=toKey(r[iD]);
    if(!det||!d)return null;
    const q=iQ>=0?String(r[iQ]||'').trim():'';
    return {date:d,y:d.slice(0,4),m:d.slice(5,7),wk:iW>=0?(parseInt(r[iW])||null):null,
            item:det,tag:iG>=0?(r[iG]||'').trim():'',qty:q?Number(q.replace(/,/g,'')):null};
  }).filter(Boolean);
}
async function grab(p){

  if(!r.ok)throw new Error('HTTP '+r.status);
  return toRows(await r.text());
}

        <td>${r.tag?`<span class="tag">${r.tag}</span><br>`:''}${r.item}</td>
        <td class="num">${r.qty!=null?fmt(r.qty):'—'}</td></tr>`;last=r.date;});
  const sum=rows.reduce((s,r)=>s+(r.qty||0),0);
  const blank=rows.filter(r=>r.qty==null).length;
  return `<table><thead><tr><th style="width:112px">วันที่</th><th>รายละเอียด</th>
    <th class="num" style="width:100px">จำนวน</th></tr></thead><tbody>${b}</tbody>
    <tfoot><tr><td colspan="2">รวม ${rows.length} รายการ${blank?` · ไม่ระบุจำนวน ${blank}`:''}</td>
    <td class="num">${fmt(sum)}</td></tr></tfoot></table>`;
}

function render(){
  const c=cfg();
  el('title').textContent=c.title;
  el('subtitle').textContent=c.sub;
  el('source').textContent='ที่มา: '+c.source;

  const sets=c.panels.map(p=>({p,rows:(DATA[p.k]||[]).filter(match)}));

  /* ---- KPI ---- */
  const days=new Set(sets.flatMap(s=>s.rows.map(r=>r.date)).filter(Boolean));
  const total=sets.reduce((n,s)=>n+s.rows.length,0);
  let k=sets.map((s,i)=>{
    const q=s.rows.reduce((a,r)=>a+(r.qty||0),0);
    return {l:s.p.t.replace('ประจำวัน',''),v:s.rows.length,n:q?`รวม ${fmt(q)} ${s.p.k==='issue'?'order':'ชิ้น'}`:s.p.unit};
  });
  k.push({l:'วันที่มีงาน',v:days.size,
    n:days.size?`เฉลี่ย ${(total/days.size).toFixed(1)} รายการ/วัน`:'วัน'});
  if(TEAM==='delivery') k.push({l:'จำนวนออเดอร์',v:'รอข้อมูล',n:'ยังไม่ได้เชื่อมแหล่งข้อมูล',pending:true});
  if(TEAM!=='delivery'){
    const tg={};sets[0].rows.forEach(r=>{const t=r.tag||'ไม่ระบุ';tg[t]=(tg[t]||0)+1;});
    const top=Object.entries(tg).sort((a,b)=>b[1]-a[1])[0];
    k.push({l:'พบบ่อยที่สุด',v:top?top[1]:0,n:top?top[0]:'—'});
  }
  el('kpis').style.gridTemplateColumns=`repeat(${k.length},1fr)`;
  el('kpis').innerHTML=k.map((x,i)=>
    `<div class="kpi ${x.pending?'pending':'c'+i}"><div class="l">${x.l}</div>
     <div class="v">${typeof x.v==='number'?fmt(x.v):x.v}</div><div class="n">${x.n}</div></div>`).join('');

  /* ---- ช่องข้อมูล ---- */
  el('panels').style.gridTemplateColumns=`repeat(${sets.length},1fr)`;
  el('panels').innerHTML=sets.map(s=>
    `<div class="panel"><div class="hd ${s.p.hd}">
       <h2>${s.p.t} <em>${s.rows.length} ${s.p.unit}</em></h2>
       <div class="cap">${s.p.c}</div></div>
     <div class="scroll">${tableHTML(s.rows,s.p.empty)}</div></div>`).join('');

  const ks=[...days].sort();
  el('period').textContent=ks.length
    ?(ks[0]===ks[ks.length-1]?show(ks[0]):`${show(ks[0])} – ${show(ks[ks.length-1])}`):'—';
  const bits=[];
  if($('fy').value)bits.push('ปี '+$('fy').value);
  if($('fm').value)bits.push(MONTHS[+$('fm').value-1]);
  if($('fw').value)bits.push('สัปดาห์ '+$('fw').value);
  if(FD.value)bits.push(show(FD.value));
  el('chip').style.display=bits.length?'inline-block':'none';
  el('chip').textContent=bits.join(' · ');
}

function opts(sel,list,label,all){
  const cur=sel.value;
  if(sel===FD){FD.options=list;FD.value=list.includes(cur)?cur:'';drawCal();return;}
  sel.innerHTML=`<option value="">${all}</option>`+list.map(v=>`<option value="${v}">${label(v)}</option>`).join('');
  sel.value=list.includes(cur)?cur:'';sel.disabled=!list.length;
}
function fillFilters(){
  const rows=allRows().filter(r=>r.date);
  const uniq=(a,f)=>[...new Set(a.map(f).filter(Boolean))].sort();
  opts($('fy'),uniq(rows,r=>r.y),v=>'ปี '+v,'ทุกปี');
  const y=$('fy').value,byY=rows.filter(r=>!y||r.y===y);
  opts($('fm'),uniq(byY,r=>r.m),v=>MONTHS[+v-1],'ทุกเดือน');
  const m=$('fm').value,byM=byY.filter(r=>!m||r.m===m);
  opts($('fw'),uniq(byM,r=>r.wk?String(r.wk):'').sort((a,b)=>a-b),v=>'สัปดาห์ '+v,'ทุกสัปดาห์');
  const w=$('fw').value,byW=byM.filter(r=>!w||String(r.wk)===w);
  opts(FD,uniq(byW,r=>r.date),v=>show(v),'ทุกวัน');
}

/* ---------- ปฏิทิน ---------- */
const ymOf=k=>k.slice(0,7);
const calMonths=()=>[...new Set(FD.options.map(ymOf))].sort();
function drawCal(){
  const ms=calMonths();
  if(!ms.length){el('calGrid').innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--mute);padding:18px 0;font-size:12px">ไม่มีวันที่มีงาน</div>';
    el('calTitle').textContent='—';el('calPrev').disabled=el('calNext').disabled=true;syncBtn();return;}
  if(!calYM||!ms.includes(calYM))calYM=FD.value?ymOf(FD.value):ms[ms.length-1];
  const i=ms.indexOf(calYM);
  el('calPrev').disabled=i<=0;el('calNext').disabled=i>=ms.length-1;
  const [y,m]=calYM.split('-').map(Number);
  el('calTitle').textContent=`${MONTHS[m-1]} ${y}`;
  const pad=(new Date(y,m-1,1).getDay()+6)%7, days=new Date(y,m,0).getDate();
  let out='';
  for(let p=0;p<pad;p++)out+='<button class="pad" disabled tabindex="-1"></button>';
  for(let d=1;d<=days;d++){
    const key=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=FD.options.includes(key),sel=FD.value===key;
    out+=`<button type="button" data-k="${key}" class="${has?'has':''}${sel?' sel':''}" ${has?'':'disabled'}>${d}</button>`;
  }
  el('calGrid').innerHTML=out;syncBtn();
}
function syncBtn(){const b=el('fdBtn');b.textContent=FD.value?show(FD.value):'ทุกวัน';b.dataset.on=FD.value?'1':'0';}
function openCal(o){el('cal').hidden=!o;el('fdBtn').setAttribute('aria-expanded',o?'true':'false');if(o)drawCal();}
el('fdBtn').addEventListener('click',e=>{e.stopPropagation();openCal(el('cal').hidden);});
el('cal').addEventListener('click',e=>{e.stopPropagation();
  const b=e.target.closest('button[data-k]');if(!b)return;
  FD.value=FD.value===b.dataset.k?'':b.dataset.k;openCal(false);fillFilters();render();});
el('calPrev').addEventListener('click',()=>{const ms=calMonths();calYM=ms[Math.max(0,ms.indexOf(calYM)-1)];drawCal();});
el('calNext').addEventListener('click',()=>{const ms=calMonths();calYM=ms[Math.min(ms.length-1,ms.indexOf(calYM)+1)];drawCal();});
el('calAll').addEventListener('click',()=>{FD.value='';openCal(false);fillFilters();render();});
document.addEventListener('click',()=>openCal(false));

function stamp(){const d=new Date();
  el('ts').textContent=`ข้อมูล ณ ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()} `
    +`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} น.`
    +(live?'':' · ข้อมูลสำรอง');}

async function load(){
  ['fy','fm','fw'].forEach(i=>el(i).value='');FD.value='';calYM=null;
  el('stat').className='stat';el('stat').textContent='กำลังดึงข้อมูล…';el('reload').disabled=true;
  const ps=cfg().panels;
  const res=await Promise.allSettled(ps.map(grab));
  DATA={};const bad=[];
  res.forEach((r,i)=>{
    if(r.status==='fulfilled') DATA[ps[i].k]=r.value;
    else {DATA[ps[i].k]= (TEAM==='delivery'&&ps[i].k==='mo')?norm(SNAP):[]; bad.push(ps[i].t);}
  });
  live=bad.length<ps.length;
  if(!bad.length){el('stat').innerHTML='เชื่อมกับ Google Sheet แล้ว · <b>ข้อมูลสด</b>';}
  else{el('stat').className='stat err';
    el('stat').innerHTML=`<b>ดึงไม่ได้: ${bad.join(', ')}</b>${live?' · ส่วนที่เหลือเป็นข้อมูลสด':''}`;}
  el('reload').disabled=false;fillFilters();render();stamp();
}

/* ---------- สลับทีม ---------- */
function team(name){
  if(!TEAMS[name])name='delivery';
  TEAM=name;
  document.querySelectorAll('.teams button').forEach(b=>b.setAttribute('aria-selected',b.dataset.team===name));
  history.replaceState(null,'','#'+name);
  load();
}
document.querySelectorAll('.teams button').forEach(b=>
  b.addEventListener('click',()=>team(b.dataset.team)));

['fy','fm','fw'].forEach(i=>el(i).addEventListener('change',()=>{fillFilters();render();}));
el('clear').addEventListener('click',()=>{['fy','fm','fw'].forEach(i=>el(i).value='');FD.value='';calYM=null;fillFilters();render();});
el('reload').addEventListener('click',load);

/* ---------- โหมดพรีเซนต์ ---------- */
function setPresent(on){
  document.body.classList.toggle('present',on);
  if(on&&!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});
  if(!on&&document.fullscreenElement)document.exitFullscreen?.();
}
el('present').addEventListener('click',()=>setPresent(true));
el('exitPresent').addEventListener('click',()=>setPresent(false));
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('present');});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(document.body.classList.contains('present'))setPresent(false);
  openCal(false);
});

/* ---------- บันทึกรูป ---------- */
el('save').addEventListener('click',async()=>{
  const b=el('save'),sh=el('shot'),mode=el('shotMode').value;
  b.disabled=true;b.textContent='กำลังบันทึก…';
  document.body.classList.add('cap');
  sh.classList.add(mode==='slide'?'cap-slide':'cap-full');
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  try{
    const opt={backgroundColor:'#FFFFFF',useCORS:true};
    if(mode==='slide')Object.assign(opt,{scale:2.4,width:1600,height:900,windowWidth:1640,windowHeight:940});
    else opt.scale=2;
    const c=await html2canvas(sh,opt);
    const a=document.createElement('a');
    const f=[el('fy').value,el('fm').value,el('fw').value,FD.value].filter(Boolean).join('-');
    a.download=`${TEAM}-report${f?'-'+f:''}-${new Date().toISOString().slice(0,10)}.png`;
    a.href=c.toDataURL('image/png');a.click();
  }catch(e){alert('บันทึกรูปไม่สำเร็จ: '+e.message);}
  sh.classList.remove('cap-slide','cap-full');
  document.body.classList.remove('cap');
  b.disabled=false;b.textContent='บันทึกเป็นรูป';
});

team((location.hash||'#delivery').slice(1));
</script>
</body>
</html>
