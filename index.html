#vKPI .kf{display:flex;flex-direction:column;gap:4px}
#vKPI .kf>label{font-size:16px;letter-spacing:.08em;color:var(--mute);
  font-family:'IBM Plex Mono',monospace,Tahoma}
#vKPI .kcal{position:relative}
#vKPI #kDayBtn[data-on="1"]{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:bold}
#vKPI .kcal-p{position:absolute;top:calc(100% + 6px);left:0;z-index:60;width:300px;background:#fff;

  font-size:19px;font-weight:bold}

#vKPI .kcal-f .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);
  display:inline-block;margin-right:6px}
#vKPI .kcal-f .lnk{background:none;border:0;color:var(--teal);font-family:inherit;font-size:14px;
  cursor:pointer;text-decoration:underline;padding:0}

#vKPI .kpis{display:grid;grid-template-columns:1fr;gap:14px}

  align-items:center;column-gap:34px;row-gap:6px;padding:24px 30px}
#vKPI .kpi>.l{grid-column:1;grid-row:1;margin:0}
#vKPI .kpi>.t{grid-column:1;grid-row:2;margin:0}
#vKPI .kpi>.row{grid-column:2;grid-row:1/3;margin:0;justify-content:flex-start}
#vKPI .kpi>.base{grid-column:3;grid-row:1;text-align:right;align-self:end}
#vKPI .kpi>.bar{grid-column:3;grid-row:2;margin:0;align-self:start}
@media(max-width:1100px){
  #vKPI .kpi{grid-template-columns:1fr;column-gap:0}
  #vKPI .kpi>.l,#vKPI .kpi>.t,#vKPI .kpi>.row,#vKPI .kpi>.base,#vKPI .kpi>.bar{
    grid-column:1;grid-row:auto;text-align:left}
}#vKPI .kpi{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:26px 28px;

  color:var(--mute);font-size:21.8px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}#vKPI @media(max-width:1000px){.wrap{padding-left:4%;padding-right:4%}#kShot{padding:22px 18px 28px}
  .top{grid-template-columns:1fr}h1{font-size:43.5px}}

<body>

<div class="navbar">

<div id="vKPI">
<div class="wrap">

<script>
/* ---------- หน้า KPI ---------- */
(function(){
const S_OTP='1WkCx6lRNm-4LyX8CY9EEPSb2NuZPxZV0YE_z3ayu8ys';   /* KPI On-Time / Out of Stock */
const S_DIFF='1PW5l0CVt2uIGBXWOHeDjyyTil2o5O0IsseBR_2drrm4'; /* Stock Diff */
const S_DOCK='1wE-ElRc3EtMshE54wnK_B2xBtD_cKyo-k5hWTy3zOrY'; /* Dock to Stock */
const G_DOCK='1625574187';

const el=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('en-US');
const pct=n=>n==null?'—':n.toFixed(2)+'%';
const MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
              'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const showD=k=>{if(!k)return '—';const[y,m,d]=k.split('-');return `${d} ${MONTHS[+m-1]} ${y}`;};

function parseCSV(t){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(c!=='\r')cell+=c;}
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows;
}
/* ชีต On-Time มีข้อมูลกว่าแสนแถว จึงให้ Google สรุปมาให้ก่อนด้วย gviz query
   แทนการดึงทั้งไฟล์มาคำนวณในเบราว์เซอร์ */
async function gviz(sheet,gid,q,ms=90000,keepHeader=false){
  const u=`https://docs.google.com/spreadsheets/d/${sheet}/gviz/tq?tqx=out:csv&gid=${gid}`
        +(q?`&tq=${encodeURIComponent(q)}`:'');
  const ac=new AbortController();
  const timer=setTimeout(()=>ac.abort(),ms);
  try{
    const r=await fetch(u,{signal:ac.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const t=await r.text();
    if(/^\/\*O_o\*\//.test(t)||/"errors"/.test(t))throw new Error('ชีตปฏิเสธคำสั่ง (ตรวจสิทธิ์แชร์)');
    const rows=parseCSV(t);
    return keepHeader?rows:rows.slice(1);
  }catch(e){
    throw new Error(e.name==='AbortError'?'หมดเวลารอ (ชีตใหญ่เกินไป)':e.message);
  }finally{clearTimeout(timer);}
}
const toKey=s=>{s=String(s||'').trim();
  /* gviz คืนคอลัมน์ชนิดวันที่มาในรูป Date(2026,4,11) เดือนเริ่มที่ 0 */
  let m=s.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})/);
  if(m)return `${m[1]}-${String(+m[2]+1).padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;if(y>2500)y-=543;
        return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:'';
};
/* วันเดียวกันของเดือนก่อน — ถ้าเดือนก่อนไม่มีวันนั้น (เช่น 31 มี.ค. → ก.พ.) ให้ใช้วันสุดท้ายของเดือน */
const prevMonth=k=>{const[y,m,d]=k.split('-').map(Number);
  const py=m===1?y-1:y, pm=m===1?12:m-1;
  const dd=Math.min(d,new Date(py,pm,0).getDate());
  return `${py}-${String(pm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;};

/* ---------- ดึงข้อมูล ---------- */
let DATES=[],DIFF=null,DOCK=null,LAST_STATS=null;

/* ===== ใช้กติกาเดียวกับ dashboard เดิม (tdfb-dashboard-v2) ทุกข้อ =====
   1. ตัดสินค้าที่ไม่ใช่สินค้าจริงออกก่อน (Box / ค่าส่ง / คูปอง / ส่วนลด / Product Card / เอกสาร)
   2. On-Time = ระดับ "ออเดอร์" · สถานะของออเดอร์ = อันที่แย่ที่สุดในออเดอร์นั้น
      และตัวหารนับเฉพาะ on-time + late (ไม่รวมที่ระบุไม่ได้)
   3. Out of Stock = ระดับ "ชิ้น" ถ่วงน้ำหนักด้วย Order Line · ว่าง/ไม่ระบุ ถือเป็น late */
const EXCLUDED_PREFIX=['box','shipping fee','coupon','discount','product card','เอกสาร'];
const isExcludedProduct=n=>{n=(n||'').trim().toLowerCase();
  return !!n&&EXCLUDED_PREFIX.some(p=>n.startsWith(p));};
const parseQty=v=>{const n=Number(String(v==null?'':v).replace(/,/g,'').trim());
  return Number.isFinite(n)?n:0;};

function classify(status){
  if(!status)return 'unknown';
  const s=String(status).trim();
  if(s==='ใช่')return 'ontime';
  if(s==='ไม่ใช่'||s==='ไม่')return 'late';
  if(s.includes('ไม่'))return 'late';
  if(s.includes('ก่อน'))return 'early';
  if(s.includes('ในวัน'))return 'ontime';
  if(s.includes('วันถัดไป')||s.includes('ช้า'))return 'late';
  const m=s.match(/วันที่\s*(\d+)/);
  if(m&&Number(m[1])>=2)return 'late';
  return 'unknown';
}
function combineStatus(p,w){
  if(p==='late'||w==='late')return 'late';
  if(p==='ontime'||p==='early')return p;
  if(w==='ontime'||w==='early')return w;
  return 'unknown';
}

/* วันที่ในชีตเป็น DD/MM/YYYY — ถ้าให้ gviz เทียบวันที่ตรงๆ จะพลาดง่าย
   (คอลัมน์อาจเป็นข้อความ / รูปแบบไม่ตรง) จึงดึง "ทั้งสัปดาห์" มาแล้วกรองวันเอง
   ด้วยตัวแปลงวันที่ชุดเดียวกับ dashboard เดิม แล้ว cache ไว้ต่อสัปดาห์ */
function parseDMY(s){
  if(!s)return null;
  const str=String(s).trim();
  let m=str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m=str.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})/);
  if(m)return `${m[1]}-${String(+m[2]+1).padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return null;
}

/* dashboard เดิมโหลดทั้งชีตด้วย /export?format=csv แล้วคำนวณในเบราว์เซอร์
   ทำแบบเดียวกันเป๊ะ จะได้ตัวเลขตรงกันทุกตัว ไม่ต้องพึ่งการกรองวันที่ฝั่ง Google */
let RAW=[], COLS=null;

async function loadOTP(){
  const url=`https://docs.google.com/spreadsheets/d/${S_OTP}/export?format=csv&gid=0&_=${Date.now()}`;
  el('kStat').textContent='กำลังดาวน์โหลดข้อมูลจากชีต (ไฟล์ใหญ่ ใช้เวลาสักครู่)…';
  const r=await fetch(url);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();
  if(t.trim().startsWith('<'))throw new Error('ชีตยังไม่ได้แชร์เป็น “ทุกคนที่มีลิงก์”');

  /* ชีตนี้มีแสนกว่าแถว — ต้องใช้ PapaParse เท่านั้น
     ตัวแยก CSV ที่เขียนเองไล่ทีละตัวอักษร จะช้าจนหน้าค้างเมื่อไฟล์ระดับสิบเมกะไบต์ */
  el('kStat').textContent='กำลังอ่านข้อมูล…';
  await new Promise(r=>setTimeout(r,0));
  const rows=(typeof Papa!=='undefined')
    ? Papa.parse(t,{skipEmptyLines:true}).data
    : parseCSV(t);
  if(rows.length<2)throw new Error('ชีตว่าง');

  const H=rows[0].map(c=>String(c).replace(/\s+/g,''));
  const col=(...p)=>{for(const x of p){const i=H.findIndex(v=>v.includes(x));if(i>=0)return i;}return -1;};
  COLS={ref:col('OrderReference'), del:col('วันที่ต้องการจัดส่ง'),
        wh:col('WHส่งของให้PK'), pack:col('แพ็คสินค้าเสร็จ'),
        prod:col('Product'), qty:col('OrderLine'), week:col('Week'), month:col('Month')};
  if(COLS.ref<0||COLS.del<0)throw new Error('หาคอลัมน์ Order Reference / วันที่ต้องการจัดส่ง ไม่เจอ');

  RAW=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    const ref=(r[COLS.ref]||'').trim();
    if(!ref)continue;
    if(COLS.prod>=0&&isExcludedProduct(r[COLS.prod]))continue;   /* ตัด Box / ค่าส่ง / คูปอง ฯลฯ */
    const date=parseDMY(r[COLS.del]);
    if(!date)continue;
    RAW.push({
      date, key:ref.toUpperCase(),
      month:COLS.month>=0?(r[COLS.month]||'').trim():'',
      week:COLS.week>=0?String(r[COLS.week]||'').trim():'',
      wh:COLS.wh>=0?(r[COLS.wh]||''):'',
      pack:COLS.pack>=0?(r[COLS.pack]||''):'',
      qty:COLS.qty>=0?parseQty(r[COLS.qty]):0
    });
  }
  DATES=[...new Set(RAW.map(r=>r.date))].sort();
  return RAW.length;
}

/* ===== คำนวณตามกติกา dashboard เดิม =====
   On-Time  : ระดับออเดอร์ · สถานะ = แย่สุดใน (Packing, WH) · ตัวหาร = on-time + late เท่านั้น
   Out of Stock : ระดับชิ้น ถ่วงน้ำหนักด้วย Order Line · ดูจาก WH เท่านั้น · ว่าง = late  */
function statsOf(rows){
  if(!rows.length)return null;
  const rank={late:3,unknown:2,early:1,ontime:1};
  const worst={};
  rows.forEach(r=>{
    const cls=combineStatus(classify(r.pack), classify(r.wh));
    if(!(r.key in worst)||(rank[cls]||0)>(rank[worst[r.key]]||0))worst[r.key]=cls;
  });
  const states=Object.values(worst);
  const orders=states.length;
  const onTimeOrders=states.filter(s=>s==='ontime'||s==='early').length;
  const lateOrders=states.filter(s=>s==='late').length;
  const denom=onTimeOrders+lateOrders||1;

  let items=0, okQty=0;
  rows.forEach(r=>{
    items+=r.qty;
    const c=classify(r.wh);
    if(c==='ontime'||c==='early')okQty+=r.qty;
  });

  return {orders,items,lines:rows.length,onTimeOrders,lateOrders,denom,
          otp:onTimeOrders/denom*100, oos:items?okQty/items*100:0, okQty};
}
const dayStats=key=>statsOf(RAW.filter(r=>r.date===key));

/* หาแถวหัวตารางเองแล้วจับคอลัมน์จาก "ชื่อหัว" ไม่ใช่ตำแหน่ง
   เพราะชีตชุดนี้มีหลายแท็บที่เรียงคอลัมน์ไม่เหมือนกัน */
function table(rows){
  if(!rows||!rows.length)return null;
  let hi=-1;
  for(let i=0;i<Math.min(8,rows.length);i++)
    if(rows[i].some(c=>/เกณฑ์|เช็ค|week|สัปดาห์/i.test(String(c)))){hi=i;break;}
  if(hi<0)return null;
  const H=rows[hi].map(c=>String(c).replace(/\s+/g,''));
  const col=(...p)=>{for(const x of p){const i=H.findIndex(v=>v.includes(x));if(i>=0)return i;}return -1;};
  return {H,col,rows:rows.slice(hi+1)};
}
const dnum=s=>{const m=String(s==null?'':s).match(/-?[\d.]+/);return m?parseFloat(m[0]):NaN;};
const dparse=s=>{const m=String(s==null?'':s).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  return m?Date.UTC(+m[3],+m[2]-1,+m[1]):NaN;};

let STATIC_ERR={diff:'',dock:''};

/* ชีตเล็ก: ลอง gviz ก่อน ถ้าไม่ได้ค่อยใช้ /export?format=csv (บางชีตตั้งสิทธิ์ต่างกัน) */
async function smallSheet(id,gid){
  try{
    const rows=await gviz(id,gid,null,45000,true);
    if(rows&&rows.length>1)return rows;
  }catch(e){ /* ลองทางที่สอง */ }
  const r=await fetch(`https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}&_=${Date.now()}`);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();
  if(t.trim().startsWith('<'))throw new Error('ชีตยังไม่ได้แชร์เป็น “ทุกคนที่มีลิงก์”');
  return (typeof Papa!=='undefined')?Papa.parse(t,{skipEmptyLines:true}).data:parseCSV(t);
}

async function loadStatic(){
  STATIC_ERR={diff:'',dock:''};

  /* ---- Stock Diff — คอลัมน์ "เช็ค": ตรง = ไม่ดิฟ · ไม่ตรง = ดิฟ ---- */
  try{
    const t=table(await smallSheet(S_DIFF,'0'));
    if(!t)throw new Error('หาหัวตารางไม่เจอ');
    const cD=t.col('Day','วันที่'), cW=t.col('Week','สัปดาห์'), cC=t.col('เช็ค');
    if(cC<0)throw new Error('หาคอลัมน์ “เช็ค” ไม่เจอ');
    const list=[];
    t.rows.forEach(r=>{
      const c=(r[cC]||'').trim();
      if(c!=='ตรง'&&c!=='ไม่ตรง')return;          /* กันแถวสรุป/แถวว่างท้ายชีต */
      list.push({date:cD>=0?parseDMY(r[cD]):null,
                 week:cW>=0?String(parseInt(r[cW])||''):'',
                 diff:c==='ไม่ตรง'});
    });
    if(!list.length)throw new Error('ไม่พบแถวที่มีค่า ตรง/ไม่ตรง');
    DIFF=list;
  }catch(e){ DIFF=null; STATIC_ERR.diff=e.message; console.warn('stock diff',e); }

  /* ---- Dock to Stock — 2 เกณฑ์: รับเข้า / จัดเก็บ ---- */
  try{
    const t=table(await smallSheet(S_DOCK,G_DOCK));
    if(!t)throw new Error('หาหัวตารางไม่เจอ');
    const cW=t.col('Week','week','สัปดาห์'),
          cIn=t.col('เกณฑ์รับเข้า'), cSt=t.col('เกณฑ์จัดเก็บ'),
          cDur=t.col('ระยะเวลาจัดเก็บ'),
          cSend=t.col('วันที่ของมาส่ง'), cStore=t.col('วันที่จัดเก็บ');
    if(cIn<0&&cSt<0)throw new Error('หาคอลัมน์เกณฑ์รับเข้า/จัดเก็บ ไม่เจอ');
    const pass=v=>/ผ่านเกณฑ์/.test(v)&&!/ไม่ผ่าน/.test(v);
    const by={};
    t.rows.forEach(r=>{
      const w=String(parseInt(r[cW])||'');
      if(!w)return;
      const vi=(r[cIn]||'').trim(), vs=(r[cSt]||'').trim();
      if(!vi&&!vs)return;
      const o=by[w]=by[w]||{n:0,inOk:0,stOk:0,days:0,dn:0};
      o.n++;
      if(pass(vi))o.inOk++;
      if(pass(vs))o.stOk++;
      let d=cDur>=0?dnum(r[cDur]):NaN;
      if(isNaN(d)&&cSend>=0&&cStore>=0){
        const a=dparse(r[cSend]),b=dparse(r[cStore]);
        if(!isNaN(a)&&!isNaN(b))d=(b-a)/86400000;
      }
      if(!isNaN(d)){o.days+=d;o.dn++;}
    });
    if(!Object.keys(by).length)throw new Error('ไม่พบแถวที่มีเกณฑ์');
    DOCK=by;
  }catch(e){ DOCK=null; STATIC_ERR.dock=e.message; console.warn('dock',e); }
}

/* ---------- แสดงผล ---------- */
function deltaHTML(cur,prev,goodUp=true,unit='%'){
  if(cur==null||prev==null)return '<span class="delta flat">— ไม่มีข้อมูลเทียบ</span>';
  const d=cur-prev;
  if(Math.abs(d)<0.005)return '<span class="delta flat">เท่าเดิม</span>';
  const good=goodUp?d>0:d<0;
  const arrow=d>0?'▲':'▼';
  const v=unit==='%'?Math.abs(d).toFixed(2)+' จุด':(unit==='วัน'?Math.abs(d).toFixed(2)+' วัน':fmt(Math.abs(d)));
  const rel=prev!==0?` (${(d/prev*100>0?'+':'')}${(d/prev*100).toFixed(1)}%)`:'';
  return `<span class="delta ${good?'up':'down'}">${arrow} ${v}${unit==='%'?'':rel}</span>`;
}
function kpiCard(o){
  if(o.wait)return `<div class="kpi wait"><div class="l">${o.l}</div><div class="t">${o.t}</div>
    <div class="row"><div class="v">รอข้อมูล</div><span class="badge wait">ยังไม่ได้เชื่อมชีต</span></div>
    <div class="base">${o.note||''}</div></div>`;
  const ok=o.pass;
  const w=Math.max(0,Math.min(100,o.bar!=null?o.bar:o.v));
  return `<div class="kpi ${ok?'pass':'fail'}">
    <div class="l">${o.l}</div><div class="t">${o.t}</div>
    <div class="row"><div class="v">${o.disp}</div>
      <span class="badge ${ok?'pass':'fail'}">${ok?'ผ่านเกณฑ์':'ต่ำกว่าเกณฑ์'}</span>
      ${o.delta||''}</div>
    <div class="base">${o.base||''}</div>
    <div class="bar"><i style="width:${w}%"></i></div></div>`;
}

function render(){
  const rows=filteredRows();
  const cmp=comparisonRows();
  const cur=statsOf(rows), prev=statsOf(cmp.rows);
  LAST_STATS=cur;

  /* ป้ายบอกช่วงข้อมูล */
  const days=[...new Set(rows.map(r=>r.date))].sort();
  el('kPeriod').textContent = DAYSEL ? showD(DAYSEL)
    : days.length ? (days[0]===days[days.length-1]?showD(days[0])
                    :`${showD(days[0])} – ${showD(days[days.length-1])}`) : '—';
  el('cmpNote').textContent = cmp.rows.length ? 'เทียบกับ '+cmp.label : 'ไม่มีช่วงเทียบ';

  const bits=[];
  if(fMonth())bits.push(MONTH_EN[MONTH_ORDER.indexOf(fMonth())]);
  if(fWeek())bits.push('Week '+fWeek());
  if(DAYSEL)bits.push(showD(DAYSEL));
  el('kChip').style.display=bits.length?'inline-block':'none';
  el('kChip').textContent=bits.join(' · ');

  el('top').innerHTML=`
    <div class="big a"><div class="l">จำนวนออเดอร์</div>
      <div class="v">${cur?fmt(cur.orders):'—'}</div>
      <div class="n">${cur&&prev?`ช่วงก่อน ${fmt(prev.orders)} · ${cur.orders>=prev.orders?'▲':'▼'} ${fmt(Math.abs(cur.orders-prev.orders))} (${((cur.orders-prev.orders)/(prev.orders||1)*100).toFixed(1)}%)`:'ไม่มีข้อมูลเทียบ'}</div></div>
    <div class="big b"><div class="l">จำนวนสินค้า (ชิ้น)</div>
      <div class="v">${cur?fmt(cur.items):'—'}</div>
      <div class="n">${cur&&prev?`ช่วงก่อน ${fmt(prev.items)} · ${cur.items>=prev.items?'▲':'▼'} ${fmt(Math.abs(cur.items-prev.items))} (${((cur.items-prev.items)/(prev.items||1)*100).toFixed(1)}%)`:'ไม่มีข้อมูลเทียบ'}</div></div>`;

  /* ---- Stock Diff: กรองด้วยเงื่อนไขเดียวกับ KPI ตัวอื่น ---- */
  const monthIdxOf=k=>k?+k.slice(5,7)-1:-1;
  function diffMatch(r,dayOverride){
    if(!r.date)return false;
    if(dayOverride!==undefined)return r.date===dayOverride;
    if(DAYSEL)return r.date===DAYSEL;
    if(fWeek()&&r.week!==fWeek())return false;
    if(fMonth()&&monthIdxOf(r.date)!==MONTH_ORDER.indexOf(fMonth()))return false;
    return true;
  }
  function diffStat(list){
    if(!list||!list.length)return null;
    const bad=list.filter(r=>r.diff).length;
    return {n:list.length,bad,pct:bad/list.length*100};
  }
  const diffNow = DIFF?diffStat(DIFF.filter(r=>diffMatch(r))):null;
  /* ช่วงเทียบ = วันเดียวกันเดือนก่อน (ใช้ชุดวันที่เดียวกับ KPI ด้านบน) */
  const prevDaySet=new Set([...new Set(rows.map(r=>r.date))].map(prevMonth));
  const diffPrev = DIFF?diffStat(DIFF.filter(r=>r.date&&prevDaySet.has(r.date))):null;
  const diffV=diffNow?diffNow.pct:null, diffP=diffPrev?diffPrev.pct:null;
  const dNow=diffNow;

  const wkSel=fWeek()||(DAYSEL?String(isoWeek(DAYSEL)):(rows.length?String(rows[rows.length-1].week):''));
  const kNow=DOCK?DOCK[wkSel]:null, kPrev=DOCK?DOCK[String(+wkSel-1)]:null;
  const rate=(o,f)=>o&&o.n?o[f]/o.n*100:null;
  const inV=rate(kNow,'inOk'), inP=rate(kPrev,'inOk');
  const stV=rate(kNow,'stOk'), stP=rate(kPrev,'stOk');
  const allV=(inV!=null&&stV!=null)?(inV+stV)/2:null;
  const allP=(inP!=null&&stP!=null)?(inP+stP)/2:null;
  const dayV=kNow&&kNow.dn?kNow.days/kNow.dn:null, dayP=kPrev&&kPrev.dn?kPrev.days/kPrev.dn:null;

  el('whNote').textContent=`On-Time · Out of Stock · Stock Diff = ตามตัวกรอง`
    +(wkSel?` · Dock to Stock = รายสัปดาห์ (Week ${wkSel})`:'');

  el('wh').innerHTML=[
    cur?kpiCard({l:'On-Time Performance',t:'Target ≥ 98% · ระดับออเดอร์ · แย่สุดของ WH + Packing',
      disp:pct(cur.otp),v:cur.otp,pass:cur.otp>=98,
      delta:deltaHTML(cur.otp,prev?prev.otp:null,true),
      base:`${fmt(cur.onTimeOrders)} จาก ${fmt(cur.denom)} ออเดอร์ที่ระบุสถานะได้ · ทั้งหมด ${fmt(cur.orders)}`}):
      kpiCard({l:'On-Time Performance',t:'Target ≥ 98%',wait:true,note:'ไม่มีข้อมูลในช่วงที่เลือก'}),
    cur?kpiCard({l:'Out of Stock',t:'Target ≥ 99% · ถ่วงน้ำหนักด้วยจำนวนชิ้น',
      disp:pct(cur.oos),v:cur.oos,pass:cur.oos>=99,
      delta:deltaHTML(cur.oos,prev?prev.oos:null,true),
      base:`${fmt(cur.okQty)} จาก ${fmt(cur.items)} ชิ้น`}):
      kpiCard({l:'Out of Stock',t:'Target ≥ 99%',wait:true,note:'ไม่มีข้อมูลในช่วงที่เลือก'}),
    diffV!=null?kpiCard({l:'Stock Diff',t:'Target < 2% · สัดส่วนที่นับแล้ว “ไม่ตรง” กับระบบ',
      disp:pct(diffV),v:diffV,bar:diffV*10,pass:diffV<2,
      delta:deltaHTML(diffV,diffP,false),
      base:`ไม่ตรง ${fmt(dNow.bad)} จาก ${fmt(dNow.n)} รายการที่นับ · ตรง ${fmt(dNow.n-dNow.bad)}`}):
      kpiCard({l:'Stock Diff',t:'Target < 2%',wait:true,
        note:STATIC_ERR.diff?('อ่านชีตไม่ได้ — '+STATIC_ERR.diff):'ไม่มีรายการนับสต็อกในช่วงที่เลือก'}),
    allV!=null?kpiCard({l:'Dock to Stock — ON-TIME รวม',t:`Week ${wkSel} · เฉลี่ยของรับเข้า + จัดเก็บ`,
      disp:pct(allV),v:allV,pass:allV>=90,
      delta:deltaHTML(allV,allP,true),
      base:`${pct(inV)} (รับเข้า) และ ${pct(stV)} (จัดเก็บ)`}):
      kpiCard({l:'Dock to Stock — ON-TIME รวม',t:'รายสัปดาห์',wait:true,
        note:STATIC_ERR.dock?('อ่านชีตไม่ได้ — '+STATIC_ERR.dock):'ยังไม่มีข้อมูลของสัปดาห์นี้'}),
    inV!=null?kpiCard({l:'ผ่านเกณฑ์รับเข้า',t:`Week ${wkSel} · ของมาส่ง → รับเข้าระบบ`,
      disp:pct(inV),v:inV,pass:inV>=90,delta:deltaHTML(inV,inP,true),
      base:`${fmt(kNow.inOk)} / ${fmt(kNow.n)} ผ่านเกณฑ์รับเข้า`}):'',
    stV!=null?kpiCard({l:'ผ่านเกณฑ์จัดเก็บ',t:`Week ${wkSel} · รับเข้าระบบ → จัดเก็บ`,
      disp:pct(stV),v:stV,pass:stV>=90,delta:deltaHTML(stV,stP,true),
      base:`${fmt(kNow.stOk)} / ${fmt(kNow.n)} ผ่านเกณฑ์จัดเก็บ`}):'',
    dayV!=null?kpiCard({l:'เวลาเฉลี่ยรวม (วัน)',t:`Week ${wkSel} · มาส่ง → จัดเก็บสำเร็จ`,
      disp:dayV.toFixed(2)+' วัน',v:dayV,bar:Math.max(0,100-dayV*12),pass:dayV<=5,
      delta:deltaHTML(dayV,dayP,false,'วัน'),
      base:`จาก ${fmt(kNow.dn)} รายการที่มีวันที่ครบ`}):''
  ].join('');

  el('dl').innerHTML=kpiCard({l:'Human Error',t:'Target 0 เคส/เดือน',wait:true,
    note:'ยังไม่ได้ระบุชีตต้นทาง — เตรียมช่องไว้แล้ว'});
  el('ad').innerHTML=kpiCard({l:'Admin On-Time',t:'Target ≥ 85%',wait:true,
    note:'ยังไม่ได้ระบุชีตต้นทาง — เตรียมช่องไว้แล้ว'});

  el('src').textContent='ที่มา: KPI On-Time/Out of Stock · Stock Diff · Dock to Stock (Google Sheets)';
  const now=new Date();
  el('kTs').textContent=`ข้อมูล ณ ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()} `
    +`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} น.`;
}

function isoWeek(k){
  const [y,m,d]=k.split('-').map(Number);
  const t=new Date(Date.UTC(y,m-1,d));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  const s=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil(((t-s)/86400000+1)/7);
}

const MONTH_ORDER=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                   'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MONTH_EN=['January','February','March','April','May','June',
                'July','August','September','October','November','December'];
let DAYSEL='', calYM=null, CAL_DAYS=new Set();

/* ตัวกรอง MONTH / WEEK / DAY — ว่างทั้งหมด = ดูข้อมูลทั้งชุด */
const fMonth=()=>el('kM').value, fWeek=()=>el('kW').value;
function matchRow(r){
  if(DAYSEL) return r.date===DAYSEL;
  if(fWeek() && String(r.week)!==fWeek()) return false;
  if(fMonth() && r.month!==fMonth()) return false;
  return true;
}
const filteredRows=()=>RAW.filter(matchRow);

/* ช่วงเทียบ = "ช่วงเดียวกันของเดือนก่อน" เสมอ
   เลื่อนทุกวันที่ในช่วงที่เลือกถอยหลัง 1 เดือน แล้วเอาข้อมูลของวันเหล่านั้นมาเทียบ
   เลือกวันเดียว → วันเดียวกันเดือนก่อน · เลือกสัปดาห์/เดือน → ช่วงเดียวกันเดือนก่อน */
function comparisonRows(){
  const days=[...new Set(filteredRows().map(r=>r.date))].sort();
  if(!days.length)return {label:'',rows:[]};
  const prevDays=new Set(days.map(prevMonth));
  const rows=RAW.filter(r=>prevDays.has(r.date));
  const pd=[...prevDays].sort();
  const label=pd.length===1?showD(pd[0]):`${showD(pd[0])} – ${showD(pd[pd.length-1])}`;
  return {label,rows};
}

function opts(sel,list,label,all){
  const cur=sel.value;
  sel.innerHTML=`<option value="">${all}</option>`
    +list.map(v=>`<option value="${v}">${label(v)}</option>`).join('');
  sel.value=list.includes(cur)?cur:'';
  sel.disabled=!list.length;
}
function fillFilters(){
  const months=MONTH_ORDER.filter(m=>RAW.some(r=>r.month===m));
  opts(el('kM'),months,v=>MONTH_EN[MONTH_ORDER.indexOf(v)]||v,'All');
  const byM=RAW.filter(r=>!fMonth()||r.month===fMonth());
  const weeks=[...new Set(byM.map(r=>String(r.week)).filter(w=>w&&w!=='undefined'))]
    .sort((a,b)=>a-b);
  opts(el('kW'),weeks,v=>'Week '+v,'All');
  const byW=byM.filter(r=>!fWeek()||String(r.week)===fWeek());
  CAL_DAYS=new Set(byW.map(r=>r.date));
  if(DAYSEL&&!CAL_DAYS.has(DAYSEL))DAYSEL='';
  drawCal();
}

/* ---------- ปฏิทิน ---------- */
const ymOf=k=>k.slice(0,7);
const calMonths=()=>[...new Set([...CAL_DAYS].map(ymOf))].sort();
function drawCal(){
  const ms=calMonths();
  const btn=el('kDayBtn');
  btn.textContent=DAYSEL?showD(DAYSEL):'All';
  btn.dataset.on=DAYSEL?'1':'0';
  if(!ms.length){
    el('kCalGrid').innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--mute);padding:18px 0;font-size:14px">no data</div>';
    el('kCalTitle').textContent='—';
    el('kPrev').disabled=el('kNext').disabled=true;return;
  }
  if(!calYM||!ms.includes(calYM))calYM=DAYSEL?ymOf(DAYSEL):ms[ms.length-1];
  const i=ms.indexOf(calYM);
  el('kPrev').disabled=i<=0; el('kNext').disabled=i>=ms.length-1;
  const [y,m]=calYM.split('-').map(Number);
  el('kCalTitle').textContent=`${MONTH_EN[m-1]} ${y}`;
  const pad=(new Date(y,m-1,1).getDay()+6)%7, days=new Date(y,m,0).getDate();
  let out='';
  for(let p=0;p<pad;p++)out+='<button class="pad" disabled tabindex="-1"></button>';
  for(let d=1;d<=days;d++){
    const k=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=CAL_DAYS.has(k), sel=DAYSEL===k;
    out+=`<button type="button" data-k="${k}" class="${has?'has':''}${sel?' sel':''}" ${has?'':'disabled'}>${d}</button>`;
  }
  el('kCalGrid').innerHTML=out;
}
function openCal(o){
  el('kCal').hidden=!o;
  el('kDayBtn').setAttribute('aria-expanded',o?'true':'false');
  if(o)drawCal();
}
el('kDayBtn').addEventListener('click',e=>{e.stopPropagation();openCal(el('kCal').hidden);});
el('kCal').addEventListener('click',e=>{
  e.stopPropagation();
  const b=e.target.closest('button[data-k]');if(!b)return;
  DAYSEL=DAYSEL===b.dataset.k?'':b.dataset.k;
  openCal(false);fillFilters();render();
});
el('kPrev').addEventListener('click',()=>{const ms=calMonths();calYM=ms[Math.max(0,ms.indexOf(calYM)-1)];drawCal();});
el('kNext').addEventListener('click',()=>{const ms=calMonths();calYM=ms[Math.min(ms.length-1,ms.indexOf(calYM)+1)];drawCal();});
el('kCalAll').addEventListener('click',()=>{DAYSEL='';openCal(false);fillFilters();render();});
document.addEventListener('click',()=>openCal(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape')openCal(false);});

['kM','kW'].forEach(id=>el(id).addEventListener('change',()=>{
  if(id==='kM')el('kW').value='';
  DAYSEL='';calYM=null;fillFilters();render();
}));
el('kClear').addEventListener('click',()=>{
  el('kM').value='';el('kW').value='';DAYSEL='';calYM=null;fillFilters();render();
});

async function boot(){
  el('kStat').className='stat';el('kReload').disabled=true;
  el('kStat').textContent='กำลังอ่านรายการวันที่จากชีต…';
  try{
    const n=await loadOTP();
    if(!DATES.length)throw new Error('อ่านคอลัมน์ “วันที่ต้องการจัดส่ง” ไม่ได้');
    el('kStat').innerHTML=`อ่านวันที่ได้ ${DATES.length} วัน `
      +`(${showD(DATES[0])} – ${showD(DATES[DATES.length-1])}) · ${fmt(n)} บรรทัด · กำลังคำนวณ…`;
    fillFilters();render();
    const s=LAST_STATS;
    el('kStat').innerHTML='เชื่อมกับ Google Sheet แล้ว · <b>ข้อมูลสด</b>'
      +(s?` · แถวของวันนี้ ${fmt(s.lines)} บรรทัด → ${fmt(s.orders)} ออเดอร์ · ${fmt(s.items)} ชิ้น`:'');
  }catch(e){
    el('kStat').className='stat err';
    el('kStat').innerHTML='<b>ดึงข้อมูลไม่ได้</b> — '+e.message;
    el('kReload').disabled=false;
    return;
  }
  el('kReload').disabled=false;

  /* Stock Diff / Dock to Stock โหลดต่อเบื้องหลัง แล้วค่อยวาดซ้ำ */
  loadStatic().then(()=>render())
              .catch(e=>console.warn('static',e));
}
el('kReload').addEventListener('click',boot);
el('kSave').addEventListener('click',async()=>{
  const b=el('kSave');b.disabled=true;b.textContent='กำลังบันทึก…';
  try{
    const c=await html2canvas(el('kShot'),{scale:2,backgroundColor:'#FFFFFF',useCORS:true});
    const a=document.createElement('a');
    const tag=[fMonth()&&MONTH_EN[MONTH_ORDER.indexOf(fMonth())],
               fWeek()&&('W'+fWeek()), DAYSEL].filter(Boolean).join('-')||'all';
    a.download=`kpi-overview-${tag}.png`;
    a.href=c.toDataURL('image/png');a.click();
  }catch(e){alert('บันทึกรูปไม่สำเร็จ: '+e.message);}
  b.disabled=false;b.textContent='บันทึกเป็นรูป';
});
boot();

})();
</script>

function toKey(s){
  s=String(s||'').trim();
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;if(y>2500)y-=543;
        return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:'';
}
const show=k=>{if(!k)return '—';const[y,m,d]=k.split('-');return `${d}/${m}/${y.slice(2)}`;};

function parseCSV(t){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(cell);cell='';}
    else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(c!=='\r')cell+=c;}
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows;
}
/* แต่ละแท็บวางหัวตารางคนละแถวและใช้ชื่อคอลัมน์ต่างกัน จึงหาหัวตารางเองแล้วจับตามชื่อ */
function toRows(csv){
  const raw=parseCSV(csv);let hi=-1;
  for(let i=0;i<Math.min(6,raw.length);i++) if(raw[i].some(c=>/วันที่/.test(c))){hi=i;break;}
  if(hi<0)return [];
  const H=raw[hi].map(c=>String(c).replace(/\s+/g,''));
  const find=(...p)=>{for(const x of p){const i=H.findIndex(h=>h.includes(x));if(i>=0)return i;}return -1;};
  const iD=find('วันที่พบปัญหา','วันที่จัดทำ','วันที่ได้รับ','วันที่'),iW=find('สัปดาห์'),
        iT=find('รายละเอียด','ปัญหาที่พบ','รายการสินค้า'),iQ=find('จำนวน'),
        iG=find('เกณฑ์','ประเภทสาเหตุ','ผู้แจ้ง');
  return raw.slice(hi+1).map(r=>{
    const det=(r[iT]||'').trim(),d=toKey(r[iD]);
    if(!det||!d)return null;
    const q=iQ>=0?String(r[iQ]||'').trim():'';
    return {date:d,y:d.slice(0,4),m:d.slice(5,7),wk:iW>=0?(parseInt(r[iW])||null):null,
            item:det,tag:iG>=0?(r[iG]||'').trim():'',qty:q?Number(q.replace(/,/g,'')):null};
  }).filter(Boolean);
}
async function grab(p){
  const r=await fetch(`https://docs.google.com/spreadsheets/d/${p.sheet}/gviz/tq?tqx=out:csv&gid=${p.gid}`);
  if(!r.ok)throw new Error('HTTP '+r.status);
  return toRows(await r.text());
}

let TEAM='delivery',DATA={},live=false,calYM=null;
const norm=a=>a.map(r=>{const d=r.date.includes('-')?r.date:toKey(r.date);
  return {...r,date:d,y:d.slice(0,4),m:d.slice(5,7),tag:r.tag||''};});
const match=r=>{const y=$('fy').value,m=$('fm').value,w=$('fw').value,d=FD.value;
  return (!y||r.y===y)&&(!m||r.m===m)&&(!w||String(r.wk)===w)&&(!d||r.date===d);};
const cfg=()=>TEAMS[TEAM];
const allRows=()=>cfg().panels.flatMap(p=>DATA[p.k]||[]);

function tableHTML(rows,empty){
  if(!rows.length)return `<div class="empty"><b>ยังไม่มีข้อมูล</b>${empty}</div>`;
  let last='',b='';
  rows.forEach(r=>{const n=r.date!==last;
    b+=`<tr class="${n?'newday':''}"><td class="d">${n?show(r.date):''}</td>
        <td>${r.tag?`<span class="tag">${r.tag}</span><br>`:''}${r.item}</td>
        <td class="num">${r.qty!=null?fmt(r.qty):'—'}</td></tr>`;last=r.date;});
  const sum=rows.reduce((s,r)=>s+(r.qty||0),0);
  const blank=rows.filter(r=>r.qty==null).length;
  return `<table><thead><tr><th style="width:112px">วันที่</th><th>รายละเอียด</th>
    <th class="num" style="width:100px">จำนวน</th></tr></thead><tbody>${b}</tbody>
    <tfoot><tr><td colspan="2">รวม ${rows.length} รายการ${blank?` · ไม่ระบุจำนวน ${blank}`:''}</td>
    <td class="num">${fmt(sum)}</td></tr></tfoot></table>`;
}

function render(){
  const c=cfg();
  el('title').textContent=c.title;
  el('subtitle').textContent=c.sub;
  el('source').textContent='ที่มา: '+c.source;

  const sets=c.panels.map(p=>({p,rows:(DATA[p.k]||[]).filter(match)}));

  /* ---- KPI ---- */
  const days=new Set(sets.flatMap(s=>s.rows.map(r=>r.date)).filter(Boolean));
  const total=sets.reduce((n,s)=>n+s.rows.length,0);
  let k=sets.map((s,i)=>{
    const q=s.rows.reduce((a,r)=>a+(r.qty||0),0);
    return {l:s.p.t.replace('ประจำวัน',''),v:s.rows.length,n:q?`รวม ${fmt(q)} ${s.p.k==='issue'?'order':'ชิ้น'}`:s.p.unit};
  });
  k.push({l:'วันที่มีงาน',v:days.size,
    n:days.size?`เฉลี่ย ${(total/days.size).toFixed(1)} รายการ/วัน`:'วัน'});
  if(TEAM==='delivery') k.push({l:'จำนวนออเดอร์',v:'รอข้อมูล',n:'ยังไม่ได้เชื่อมแหล่งข้อมูล',pending:true});
  if(TEAM!=='delivery'){
    const tg={};sets[0].rows.forEach(r=>{const t=r.tag||'ไม่ระบุ';tg[t]=(tg[t]||0)+1;});
    const top=Object.entries(tg).sort((a,b)=>b[1]-a[1])[0];
    k.push({l:'พบบ่อยที่สุด',v:top?top[1]:0,n:top?top[0]:'—'});
  }
  el('kpis').style.gridTemplateColumns=`repeat(${k.length},1fr)`;
  el('kpis').innerHTML=k.map((x,i)=>
    `<div class="kpi ${x.pending?'pending':'c'+i}"><div class="l">${x.l}</div>
     <div class="v">${typeof x.v==='number'?fmt(x.v):x.v}</div><div class="n">${x.n}</div></div>`).join('');

  /* ---- ช่องข้อมูล ---- */
  el('panels').style.gridTemplateColumns=`repeat(${sets.length},1fr)`;
  el('panels').innerHTML=sets.map(s=>
    `<div class="panel"><div class="hd ${s.p.hd}">
       <h2>${s.p.t} <em>${s.rows.length} ${s.p.unit}</em></h2>
       <div class="cap">${s.p.c}</div></div>
     <div class="scroll">${tableHTML(s.rows,s.p.empty)}</div></div>`).join('');

  const ks=[...days].sort();
  el('period').textContent=ks.length
    ?(ks[0]===ks[ks.length-1]?show(ks[0]):`${show(ks[0])} – ${show(ks[ks.length-1])}`):'—';
  const bits=[];
  if($('fy').value)bits.push('ปี '+$('fy').value);
  if($('fm').value)bits.push(MONTHS[+$('fm').value-1]);
  if($('fw').value)bits.push('สัปดาห์ '+$('fw').value);
  if(FD.value)bits.push(show(FD.value));
  el('chip').style.display=bits.length?'inline-block':'none';
  el('chip').textContent=bits.join(' · ');
}

function opts(sel,list,label,all){
  const cur=sel.value;
  if(sel===FD){FD.options=list;FD.value=list.includes(cur)?cur:'';drawCal();return;}
  sel.innerHTML=`<option value="">${all}</option>`+list.map(v=>`<option value="${v}">${label(v)}</option>`).join('');
  sel.value=list.includes(cur)?cur:'';sel.disabled=!list.length;
}
function fillFilters(){
  const rows=allRows().filter(r=>r.date);
  const uniq=(a,f)=>[...new Set(a.map(f).filter(Boolean))].sort();
  opts($('fy'),uniq(rows,r=>r.y),v=>'ปี '+v,'ทุกปี');
  const y=$('fy').value,byY=rows.filter(r=>!y||r.y===y);
  opts($('fm'),uniq(byY,r=>r.m),v=>MONTHS[+v-1],'ทุกเดือน');
  const m=$('fm').value,byM=byY.filter(r=>!m||r.m===m);
  opts($('fw'),uniq(byM,r=>r.wk?String(r.wk):'').sort((a,b)=>a-b),v=>'สัปดาห์ '+v,'ทุกสัปดาห์');
  const w=$('fw').value,byW=byM.filter(r=>!w||String(r.wk)===w);
  opts(FD,uniq(byW,r=>r.date),v=>show(v),'ทุกวัน');
}

/* ---------- ปฏิทิน ---------- */
const ymOf=k=>k.slice(0,7);
const calMonths=()=>[...new Set(FD.options.map(ymOf))].sort();
function drawCal(){
  const ms=calMonths();
  if(!ms.length){el('calGrid').innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--mute);padding:18px 0;font-size:12px">ไม่มีวันที่มีงาน</div>';
    el('calTitle').textContent='—';el('calPrev').disabled=el('calNext').disabled=true;syncBtn();return;}
  if(!calYM||!ms.includes(calYM))calYM=FD.value?ymOf(FD.value):ms[ms.length-1];
  const i=ms.indexOf(calYM);
  el('calPrev').disabled=i<=0;el('calNext').disabled=i>=ms.length-1;
  const [y,m]=calYM.split('-').map(Number);
  el('calTitle').textContent=`${MONTHS[m-1]} ${y}`;
  const pad=(new Date(y,m-1,1).getDay()+6)%7, days=new Date(y,m,0).getDate();
  let out='';
  for(let p=0;p<pad;p++)out+='<button class="pad" disabled tabindex="-1"></button>';
  for(let d=1;d<=days;d++){
    const key=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=FD.options.includes(key),sel=FD.value===key;
    out+=`<button type="button" data-k="${key}" class="${has?'has':''}${sel?' sel':''}" ${has?'':'disabled'}>${d}</button>`;
  }
  el('calGrid').innerHTML=out;syncBtn();
}
function syncBtn(){const b=el('fdBtn');b.textContent=FD.value?show(FD.value):'ทุกวัน';b.dataset.on=FD.value?'1':'0';}
function openCal(o){el('cal').hidden=!o;el('fdBtn').setAttribute('aria-expanded',o?'true':'false');if(o)drawCal();}
el('fdBtn').addEventListener('click',e=>{e.stopPropagation();openCal(el('cal').hidden);});
el('cal').addEventListener('click',e=>{e.stopPropagation();
  const b=e.target.closest('button[data-k]');if(!b)return;
  FD.value=FD.value===b.dataset.k?'':b.dataset.k;openCal(false);fillFilters();render();});
el('calPrev').addEventListener('click',()=>{const ms=calMonths();calYM=ms[Math.max(0,ms.indexOf(calYM)-1)];drawCal();});
el('calNext').addEventListener('click',()=>{const ms=calMonths();calYM=ms[Math.min(ms.length-1,ms.indexOf(calYM)+1)];drawCal();});
el('calAll').addEventListener('click',()=>{FD.value='';openCal(false);fillFilters();render();});
document.addEventListener('click',()=>openCal(false));

function stamp(){const d=new Date();
  el('ts').textContent=`ข้อมูล ณ ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()} `
    +`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} น.`
    +(live?'':' · ข้อมูลสำรอง');}

async function load(){
  ['fy','fm','fw'].forEach(i=>el(i).value='');FD.value='';calYM=null;
  el('stat').className='stat';el('stat').textContent='กำลังดึงข้อมูล…';el('reload').disabled=true;
  const ps=cfg().panels;
  const res=await Promise.allSettled(ps.map(grab));
  DATA={};const bad=[];
  res.forEach((r,i)=>{
    if(r.status==='fulfilled') DATA[ps[i].k]=r.value;
    else {DATA[ps[i].k]= (TEAM==='delivery'&&ps[i].k==='mo')?norm(SNAP):[]; bad.push(ps[i].t);}
  });
  live=bad.length<ps.length;
  if(!bad.length){el('stat').innerHTML='เชื่อมกับ Google Sheet แล้ว · <b>ข้อมูลสด</b>';}
  else{el('stat').className='stat err';
    el('stat').innerHTML=`<b>ดึงไม่ได้: ${bad.join(', ')}</b>${live?' · ส่วนที่เหลือเป็นข้อมูลสด':''}`;}
  el('reload').disabled=false;fillFilters();render();stamp();
}

/* ---------- สลับทีม ---------- */
function team(name){
  if(!TEAMS[name])name='delivery';
  TEAM=name;
  document.querySelectorAll('.teams button').forEach(b=>b.setAttribute('aria-selected',b.dataset.team===name));
  history.replaceState(null,'','#report-'+name);
  load();
}
document.querySelectorAll('.teams button').forEach(b=>
  b.addEventListener('click',()=>team(b.dataset.team)));

['fy','fm','fw'].forEach(i=>el(i).addEventListener('change',()=>{fillFilters();render();}));
el('clear').addEventListener('click',()=>{['fy','fm','fw'].forEach(i=>el(i).value='');FD.value='';calYM=null;fillFilters();render();});
el('reload').addEventListener('click',load);

/* ---------- โหมดพรีเซนต์ ---------- */
function setPresent(on){
  document.body.classList.toggle('present',on);
  if(on&&!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});
  if(!on&&document.fullscreenElement)document.exitFullscreen?.();
}
el('present').addEventListener('click',()=>setPresent(true));
el('exitPresent').addEventListener('click',()=>setPresent(false));
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('present');});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(document.body.classList.contains('present'))setPresent(false);
  openCal(false);
});

/* ---------- บันทึกรูป ---------- */
el('save').addEventListener('click',async()=>{
  const b=el('save'),sh=el('shot'),mode=el('shotMode').value;
  b.disabled=true;b.textContent='กำลังบันทึก…';
  document.body.classList.add('cap');
  sh.classList.add(mode==='slide'?'cap-slide':'cap-full');
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  try{
    const opt={backgroundColor:'#FFFFFF',useCORS:true};
    if(mode==='slide')Object.assign(opt,{scale:2.4,width:1600,height:900,windowWidth:1640,windowHeight:940});
    else opt.scale=2;
    const c=await html2canvas(sh,opt);
    const a=document.createElement('a');
    const f=[el('fy').value,el('fm').value,el('fw').value,FD.value].filter(Boolean).join('-');
    a.download=`${TEAM}-report${f?'-'+f:''}-${new Date().toISOString().slice(0,10)}.png`;
    a.href=c.toDataURL('image/png');a.click();
  }catch(e){alert('บันทึกรูปไม่สำเร็จ: '+e.message);}
  sh.classList.remove('cap-slide','cap-full');
  document.body.classList.remove('cap');
  b.disabled=false;b.textContent='บันทึกเป็นรูป';
});

/* โหลดข้อมูลรายงานเมื่อเปิดแท็บครั้งแรกเท่านั้น */
let started=false;
window.RPT_INIT=(t)=>{ if(started){ if(t&&t!==TEAM) team(t); return; } started=true; team(t||'delivery'); };

})();
</script>
<script>
/* ---------- สลับหน้า (ลิงก์เดียว ใช้ hash) ---------- */
(function(){
  const K=document.getElementById('vKPI'), R=document.getElementById('vRPT');
  function go(v,team){
    document.querySelectorAll('.nav button').forEach(b=>
      b.setAttribute('aria-selected', b.dataset.view===v));
    K.hidden = v!=='kpi';
    R.hidden = v!=='report';
    if(v==='report'){ window.RPT_INIT && window.RPT_INIT(team); }
    else history.replaceState(null,'','#kpi');
  }
  document.querySelectorAll('.nav button').forEach(b=>
    b.addEventListener('click',()=>go(b.dataset.view)));
  const h=(location.hash||'#kpi').slice(1);
  go(h.startsWith('report')?'report':'kpi', h.startsWith('report-')?h.slice(7):null);
})();
</script>
</body>
